[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-vault-ai"
version = "0.2.1"
description = "Local-first archive search and report generation MVP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Knowledge Vault AI contributors" }]
dependencies = [
  "chromadb>=0.5.0",
  "docx2txt>=0.8",
  "pandas>=2.0.0",
  "python-docx>=1.1.0",
  "pypdf>=4.0.0",
  "streamlit>=1.36.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3.0"]
ml = ["sentence-transformers>=3.0.0"]
all = ["ollama>=0.3.0", "sentence-transformers>=3.0.0"]

[project.scripts]
knowledge-vault-ingest = "knowledge_vault.cli:ingest_main"
knowledge-vault-search = "knowledge_vault.cli:search_main"
knowledge-vault-report = "knowledge_vault.cli:report_main"

[tool.setuptools.packages.find]
include = ["knowledge_vault*"]
